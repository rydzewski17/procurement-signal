name: Daily update

# Runs every morning (about 6 a.m. Eastern) and can be started by hand from the
# Actions tab. Refreshes the Industry Wire and the Cost Pressure Monitor, checks
# the site still builds, and pushes any changes. Cloudflare redeploys on push.
on:
  schedule:
    - cron: '7 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh Industry Wire
        run: node scripts/update-wire.mjs

      - name: Refresh Cost Pressure Monitor
        run: node scripts/update-costs.mjs

      - name: Build check
        run: npm run build

      - name: Commit and push changes
        run: |
          git config user.name "procurement-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/wire.json src/data/cost-monitor.json
          if git diff --cached --quiet; then
            echo "No content changes; triggering a rebuild so dates and countdowns stay current."
            git commit --allow-empty -m "Daily rebuild $(date -u +%Y-%m-%d)"
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
          fi
          git push
